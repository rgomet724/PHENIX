name: Security checks

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check server.js
          node --check browser-security.js
          node --check portal-router.js
          node --check portail/app.js
      - name: Browser security tests
        run: node --test test/browser-security.test.js
      - name: Dashboard regression tests
        run: npm run test:dashboard
      - name: Syrius regression tests
        run: npm run test:syrius

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
